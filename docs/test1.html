<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資安整合平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F6F8;--panel:#FFFFFF;--border:#E2E8F0;
    --text:#1E293B;--text-dim:#64748B;--text-faint:#94A3B8;
    --brand:#0F4C81;--brand-light:#DCEEFB;--accent:#2563EB;
    --high:#DC2626;--high-bg:#FDECEC;--low:#059669;--low-bg:#E7F7F1;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;}

  /* 頂部導覽列 */
  .topbar{background:var(--brand-light);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;}
  .topbar-brand{display:flex;align-items:center;gap:10px;}
  .topbar-logo{width:34px;height:34px;border-radius:8px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;}
  .topbar-title{font-weight:700;font-size:15px;color:var(--brand);}
  .topbar-nav{display:flex;gap:18px;font-size:12.5px;color:var(--text-dim);}
  .topbar-nav a{color:var(--text-dim);text-decoration:none;cursor:pointer;}
  .topbar-nav a:hover{color:var(--brand);}
  .topbar-nav a.active{color:var(--brand);font-weight:700;}

  .wrap{max-width:1400px;margin:0 auto;padding:20px 24px 60px;}

  /* 通用卡片 */
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
  .card-tabs{display:flex;gap:6px;margin-bottom:12px;}
  .card-tab-btn{font-size:12.5px;padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text-dim);cursor:pointer;font-weight:600;}
  .card-tab-btn.active{background:var(--brand);color:#fff;border-color:var(--brand);}

  .list-item{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-top:1px dashed var(--border);font-size:13px;}
  .list-item:first-child{border-top:none;}
  .list-item a{color:var(--accent);text-decoration:none;flex:1;min-width:0;}
  .list-item a:hover{text-decoration:underline;}
  .list-item .list-meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-faint);white-space:nowrap;flex-shrink:0;}

  /* 儀表板上半 */
  .dash-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  .dash-bottom{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
  @media (max-width:900px){.dash-row,.dash-bottom{grid-template-columns:1fr;}}

  /* 文字雲 */
  .word-cloud{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:baseline;padding:10px 4px;}
  .word-cloud span{cursor:default;}

  .section-title{font-size:14px;font-weight:700;color:var(--brand);margin:26px 0 12px;display:flex;align-items:center;gap:8px;}
  .section-title::before{content:'';width:4px;height:16px;background:var(--brand);border-radius:2px;display:inline-block;}

  /* 搜尋列 */
  .search-bar{display:flex;gap:10px;margin-bottom:16px;}
  .search-bar input{flex:1;padding:11px 16px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;font-family:'Noto Sans TC',sans-serif;}
  .search-bar input:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .search-bar button{padding:0 22px;background:var(--brand);color:#fff;border:none;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;}
  .search-bar button:hover{background:var(--accent);}

  /* 搜尋主體：左篩選 右結果 */
  .search-layout{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start;}
  @media (max-width:900px){.search-layout{grid-template-columns:1fr;}}

  .filter-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .filter-header{background:var(--brand);color:#fff;padding:11px 16px;font-weight:700;font-size:13px;}
  .filter-group{padding:14px 16px;border-bottom:1px solid var(--border);}
  .filter-group:last-child{border-bottom:none;}
  .filter-group-title{font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:10px;}
  .filter-date-row{display:flex;flex-direction:column;gap:8px;}
  .filter-date-row label{font-size:11px;color:var(--text-dim);}
  .filter-date-row input{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:5px;font-size:12px;margin-top:3px;}
  .filter-check{display:flex;align-items:center;justify-content:space-between;padding:5px 0;font-size:12.5px;cursor:pointer;}
  .filter-check-left{display:flex;align-items:center;gap:7px;}
  .filter-check .count{color:var(--text-faint);font-family:'JetBrains Mono',monospace;font-size:11px;}
  .risk-icon{font-size:11px;}
  .filter-vendor-search{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;margin-bottom:8px;}

  .result-meta-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:12.5px;color:var(--text-dim);}
  .result-meta-bar b{color:var(--text);}

  .result-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:12px;}
  .result-title{font-size:14.5px;font-weight:700;color:var(--accent);text-decoration:none;display:block;margin-bottom:8px;}
  .result-title:hover{text-decoration:underline;}
  .result-fields{display:flex;flex-wrap:wrap;gap:16px;font-size:11.5px;color:var(--text-dim);margin-bottom:8px;}
  .result-fields b{color:var(--text);font-weight:600;}
  .risk-badge{display:inline-flex;align-items:center;gap:4px;font-weight:700;padding:1px 8px;border-radius:12px;font-size:11px;}
  .risk-badge.high{color:var(--high);background:var(--high-bg);}
  .risk-badge.low{color:var(--low);background:var(--low-bg);}
  .result-line{font-size:12px;color:var(--text-dim);margin-bottom:6px;line-height:1.6;}
  .result-line b{color:var(--text);font-weight:600;margin-right:4px;}
  .result-cve{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--brand);word-break:break-all;}
  .result-sources{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
  .result-source-item{display:flex;gap:8px;font-size:11.5px;color:var(--text-dim);margin-bottom:4px;}
  .result-source-num{color:var(--text-faint);font-family:'JetBrains Mono',monospace;flex-shrink:0;}
  .result-source-item a{color:var(--accent);text-decoration:none;}
  .result-source-item a:hover{text-decoration:underline;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <div class="topbar-logo">J</div>
    <div class="topbar-title">資安整合平台</div>
  </div>
  <div class="topbar-nav">
    <a class="active">回首頁</a>
    <a>整合檢索</a>
    <a>資料來源檢視</a>
    <a>報表管理</a>
    <a>帳號管理</a>
    <a>公告資訊管理</a>
    <a>聯繫客服</a>
    <a>登出</a>
  </div>
</div>

<div class="wrap">

  <!-- ===== 首頁儀表板區塊 ===== -->
  <div class="dash-row">
    <div class="card">
      <div class="card-tabs">
        <button class="card-tab-btn active" data-group="cve" data-tab="cve">最新發布CVE</button>
        <button class="card-tab-btn" data-group="cve" data-tab="news">最新資安新聞</button>
      </div>
      <div id="cveList"></div>
    </div>
    <div class="card">
      <div class="card-tabs">
        <button class="card-tab-btn active" data-group="weekly" data-tab="cveWeekly">CVE週報</button>
        <button class="card-tab-btn" data-group="weekly" data-tab="secWeekly">資安週報</button>
      </div>
      <div id="weeklyList"></div>
    </div>
  </div>

  <div class="dash-bottom">
    <div class="card">
      <div class="card-tabs">
        <button class="card-tab-btn active" data-group="focus" data-tab="latest">最新焦點</button>
        <button class="card-tab-btn" data-group="focus" data-tab="week">本週焦點</button>
        <button class="card-tab-btn" data-group="focus" data-tab="sub">訂閱焦點</button>
      </div>
      <div class="word-cloud" id="wordCloud"></div>
    </div>
    <div class="card">
      <div class="card-tabs"><button class="card-tab-btn active">相關文章</button></div>
      <div id="focusList"></div>
    </div>
  </div>

  <!-- ===== 進階篩選搜尋區塊 ===== -->
  <div class="section-title">整合搜尋</div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="輸入關鍵字，例如：資安弱點 and 威脅">
    <button onclick="applySearch()">搜尋</button>
  </div>

  <div class="search-layout">
    <div class="filter-card">
      <div class="filter-header">進階篩選</div>
      <div class="filter-group">
        <div class="filter-group-title">時間區間</div>
        <div class="filter-date-row">
          <label>起始時間<input type="date" id="dateFrom"></label>
          <label>結束時間<input type="date" id="dateTo"></label>
        </div>
      </div>
      <div class="filter-group">
        <div class="filter-group-title">風險等級</div>
        <div id="riskFilters"></div>
      </div>
      <div class="filter-group">
        <div class="filter-group-title">資料來源</div>
        <div id="sourceFilters"></div>
      </div>
      <div class="filter-group">
        <div class="filter-group-title">供應商</div>
        <input type="text" class="filter-vendor-search" id="vendorSearch" placeholder="搜尋供應商...">
        <div id="vendorFilters"></div>
      </div>
    </div>

    <div>
      <div class="result-meta-bar">共 <b id="resultCount">0</b> 筆資料</div>
      <div id="resultList"></div>
    </div>
  </div>

</div>

<script>
/* ================= 展示用資料 ================= */

const CVE_LATEST = [
  { title:'CVE-2026-72898：Metabase SQL注入漏洞，攻擊者可取得管理員權限', date:'2026-08-11', source:'弱點威脅週報' },
  { title:'CVE-2026-68820：Windows AFD.sys已遭實際利用的0-day', date:'2026-08-11', source:'弱點威脅週報' },
  { title:'CVE-2026-20349：Cisco ASA/FTD堆積檢查漏洞', date:'2026-08-11', source:'弱點威脅週報' },
  { title:'CVE-2026-50522：SharePoint RCE漏洞，攻擊者竊取IIS機器金鑰', date:'2026-07-30', source:'資安ITHome' },
];
const NEWS_LATEST = [
  { title:'Defender「ShieldBreak」新零時差漏洞曝光，繞過RoguePlanet修補', date:'2026-08-13', source:'國際資安政策觀測' },
  { title:'Gunra勒索集團利用Fortinet舊漏洞繞過MFA攻擊關鍵基礎設施', date:'2026-08-11', source:'資安人' },
  { title:'微軟2026年8月Patch Tuesday修補約400個CVE，含1個已遭利用0-day', date:'2026-08-11', source:'資安ITHome' },
];
const CVE_WEEKLY = [
  { title:'資安通告：08/04~08/10 資安弱點威脅彙整週報', date:'2026-08-11', source:'弱點威脅週報' },
  { title:'資安通告：07/28~08/03 資安弱點威脅彙整週報', date:'2026-08-04', source:'弱點威脅週報' },
  { title:'資安通告：07/21~07/27 資安弱點威脅彙整週報', date:'2026-07-28', source:'弱點威脅週報' },
];
const SEC_WEEKLY = [
  { title:'資安週報：AI自主攻擊工具興起，企業端點防禦面臨新挑戰', date:'2026-08-11', source:'資安人' },
  { title:'資安週報：勒索軟體集團持續利用MFA繞過手法攻擊關鍵基礎設施', date:'2026-08-04', source:'資安人' },
];

const WORDS_LATEST = [
  {t:'ShieldBreak',s:26},{t:'AI自主攻擊',s:22},{t:'Metabase',s:18},{t:'MFA繞過',s:20},
  {t:'Patch Tuesday',s:16},{t:'Gunra',s:15},{t:'零時差漏洞',s:24},{t:'Fortinet',s:14},
  {t:'供應鏈攻擊',s:13},{t:'AI Agent',s:19},{t:'勒索軟體',s:17},{t:'CISA KEV',s:15},
];
const WORDS_WEEK = [
  {t:'SharePoint',s:24},{t:'機器金鑰竊取',s:18},{t:'ToolShell',s:16},{t:'AI Agent攻擊',s:20},
  {t:'Langflow',s:17},{t:'N-able繞過',s:14},{t:'CVSS 10.0',s:19},{t:'憑證竊取',s:13},
];
const WORDS_SUB = [
  {t:'AI風險',s:22},{t:'量子資安',s:18},{t:'ChatGPT',s:16},{t:'LLM風險',s:20},
  {t:'資料外洩',s:19},{t:'零信任',s:14},{t:'供應商風險',s:15},
];

const SEARCH_RESULTS = [
  {
    title:'資安通告：08/04~08/10 資安弱點威脅彙整週報',
    pubDate:'2026-08-11', updateDate:'2026-08-11', risk:'high', source:'弱點威脅週報',
    vendor:'Microsoft', products:['SharePoint Server','Windows 11','Windows Server 2025'],
    cves:['CVE-2026-50522','CVE-2026-68820','CVE-2026-56164'],
    refs:[
      {label:'資安通告：08/04~08/10 資安弱點威脅彙整週報', url:'#'},
      {label:'SharePoint RCE漏洞遭實際利用，攻擊者竊取IIS機器金鑰建立持久性存取', url:'#'},
    ]
  },
  {
    title:'資安通告：08/04~08/10 資安弱點威脅彙整週報（Cisco/Fortinet）',
    pubDate:'2026-08-11', updateDate:'2026-08-11', risk:'high', source:'弱點威脅週報',
    vendor:'Cisco', products:['ASA','FTD','Firepower Threat Defense'],
    cves:['CVE-2026-20349'],
    refs:[{label:'Cisco ASA/FTD堆積檢查漏洞已遭實際利用，CISA列入KEV', url:'#'}]
  },
  {
    title:'FortiOS SSL VPN威脅防禦漏洞警訊',
    pubDate:'2026-07-30', updateDate:'2026-07-30', risk:'high', source:'弱點威脅週報',
    vendor:'Fortinet', products:['FortiOS','FortiGate'],
    cves:['CVE-2025-68686'],
    refs:[{label:'FortiOS敏感資訊洩漏漏洞已列入CISA KEV', url:'#'}]
  },
  {
    title:'Metabase SQL注入漏洞導致管理員權限遭竊取',
    pubDate:'2026-08-11', updateDate:'2026-08-11', risk:'high', source:'資安ITHome',
    vendor:'Metabase', products:['Metabase Open Source','Metabase Enterprise'],
    cves:['CVE-2026-72898'],
    refs:[{label:'Metabase SQL注入漏洞(CVSS 10.0)技術分析', url:'#'}]
  },
  {
    title:'Windows AFD.sys權限提升0-day已遭實際利用',
    pubDate:'2026-08-11', updateDate:'2026-08-13', risk:'high', source:'弱點威脅週報',
    vendor:'Microsoft', products:['Windows 10','Windows 11','Windows Server'],
    cves:['CVE-2026-68820'],
    refs:[{label:'Windows AFD.sys 0-day技術細節與修補建議', url:'#'}]
  },
  {
    title:'Langflow授權繞過漏洞遭AI Agent用於自主勒索攻擊',
    pubDate:'2026-08-05', updateDate:'2026-08-05', risk:'low', source:'國際資安政策觀測',
    vendor:'Langflow', products:['Langflow'],
    cves:['CVE-2026-9198','CVE-2026-55255'],
    refs:[{label:'JADEPUFFER：首例AI Agent自主執行勒索軟體攻擊分析', url:'#'}]
  },
  {
    title:'N-able N-central身分驗證繞過漏洞修補不完整',
    pubDate:'2026-08-03', updateDate:'2026-08-04', risk:'low', source:'資安人',
    vendor:'N-able', products:['N-central'],
    cves:['CVE-2026-18556','CVE-2026-18577'],
    refs:[{label:'N-able N-central漏洞修補後仍遭繞過持續利用', url:'#'}]
  },
];

/* ================= 渲染邏輯 ================= */

function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

function renderSimpleList(containerId, items){
  const el = document.getElementById(containerId);
  el.innerHTML = items.map(i => `
    <div class="list-item">
      <a href="#">${escapeHtml(i.title)}</a>
      <span class="list-meta">${escapeHtml(i.date)} ・ ${escapeHtml(i.source)}</span>
    </div>`).join('');
}

function renderWordCloud(words){
  const el = document.getElementById('wordCloud');
  const colors = ['#0F4C81','#2563EB','#059669','#D97706','#DC2626','#7C3AED'];
  el.innerHTML = words.map((w,i) => `<span style="font-size:${w.s}px;font-weight:700;color:${colors[i % colors.length]}">${escapeHtml(w.t)}</span>`).join('');
}

/* 儀表板頁籤切換 */
function bindTabGroup(group, handlers){
  document.querySelectorAll(`.card-tab-btn[data-group="${group}"]`).forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll(`.card-tab-btn[data-group="${group}"]`).forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      handlers[btn.dataset.tab]?.();
    });
  });
}

renderSimpleList('cveList', CVE_LATEST);
bindTabGroup('cve', {
  cve: () => renderSimpleList('cveList', CVE_LATEST),
  news: () => renderSimpleList('cveList', NEWS_LATEST),
});

renderSimpleList('weeklyList', CVE_WEEKLY);
bindTabGroup('weekly', {
  cveWeekly: () => renderSimpleList('weeklyList', CVE_WEEKLY),
  secWeekly: () => renderSimpleList('weeklyList', SEC_WEEKLY),
});

renderWordCloud(WORDS_LATEST);
renderSimpleList('focusList', [...CVE_LATEST, ...NEWS_LATEST].slice(0,5));
bindTabGroup('focus', {
  latest: () => renderWordCloud(WORDS_LATEST),
  week: () => renderWordCloud(WORDS_WEEK),
  sub: () => renderWordCloud(WORDS_SUB),
});

/* ================= 進階篩選搜尋 ================= */

const filterState = { risk: new Set(), source: new Set(), vendor: new Set(), keyword: '' };

function buildFilterOptions(){
  const riskCounts = { high: SEARCH_RESULTS.filter(r=>r.risk==='high').length, low: SEARCH_RESULTS.filter(r=>r.risk==='low').length };
  document.getElementById('riskFilters').innerHTML = `
    <label class="filter-check"><span class="filter-check-left"><input type="checkbox" data-risk="high"><span class="risk-icon">🟠</span>High</span><span class="count">${riskCounts.high}</span></label>
    <label class="filter-check"><span class="filter-check-left"><input type="checkbox" data-risk="low"><span class="risk-icon">🟢</span>Low</span><span class="count">${riskCounts.low}</span></label>`;

  const sources = [...new Set(SEARCH_RESULTS.map(r=>r.source))];
  document.getElementById('sourceFilters').innerHTML = sources.map(s => {
    const count = SEARCH_RESULTS.filter(r=>r.source===s).length;
    return `<label class="filter-check"><span class="filter-check-left"><input type="checkbox" data-source="${escapeHtml(s)}">${escapeHtml(s)}</span><span class="count">${count}</span></label>`;
  }).join('');

  const vendors = [...new Set(SEARCH_RESULTS.map(r=>r.vendor))];
  renderVendorFilters(vendors);

  document.querySelectorAll('#riskFilters input').forEach(cb => cb.addEventListener('change', e => {
    e.target.checked ? filterState.risk.add(e.target.dataset.risk) : filterState.risk.delete(e.target.dataset.risk);
    applySearch();
  }));
  document.querySelectorAll('#sourceFilters input').forEach(cb => cb.addEventListener('change', e => {
    e.target.checked ? filterState.source.add(e.target.dataset.source) : filterState.source.delete(e.target.dataset.source);
    applySearch();
  }));
}

function renderVendorFilters(vendors){
  document.getElementById('vendorFilters').innerHTML = vendors.map(v => {
    const count = SEARCH_RESULTS.filter(r=>r.vendor===v).length;
    return `<label class="filter-check"><span class="filter-check-left"><input type="checkbox" data-vendor="${escapeHtml(v)}">${escapeHtml(v)}</span><span class="count">${count}</span></label>`;
  }).join('');
  document.querySelectorAll('#vendorFilters input').forEach(cb => cb.addEventListener('change', e => {
    e.target.checked ? filterState.vendor.add(e.target.dataset.vendor) : filterState.vendor.delete(e.target.dataset.vendor);
    applySearch();
  }));
}

document.getElementById('vendorSearch').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  const vendors = [...new Set(SEARCH_RESULTS.map(r=>r.vendor))].filter(v => v.toLowerCase().includes(q));
  renderVendorFilters(vendors);
});

function renderResults(items){
  document.getElementById('resultCount').textContent = items.length;
  const el = document.getElementById('resultList');
  if (!items.length){
    el.innerHTML = `<div class="card" style="text-align:center;color:var(--text-faint);font-size:13px;">沒有符合條件的資料</div>`;
    return;
  }
  el.innerHTML = items.map(r => `
    <div class="result-card">
      <a class="result-title" href="#">${escapeHtml(r.title)}</a>
      <div class="result-fields">
        <span><b>發布日期</b>${escapeHtml(r.pubDate)}</span>
        <span><b>更新日期</b>${escapeHtml(r.updateDate)}</span>
        <span><b>風險等級</b><span class="risk-badge ${r.risk}">${r.risk==='high' ? '🟠 High' : '🟢 Low'}</span></span>
        <span><b>來源頻道</b>${escapeHtml(r.source)}</span>
        <span><b>供應商</b>${escapeHtml(r.vendor)}</span>
      </div>
      <div class="result-line"><b>產品</b>${r.products.map(escapeHtml).join('、')}</div>
      <div class="result-line"><b>CVE_ID</b><span class="result-cve">${r.cves.map(escapeHtml).join('、')}</span></div>
      <div class="result-sources">
        ${r.refs.map((ref,i) => `<div class="result-source-item"><span class="result-source-num">${i+1}</span><a href="${escapeHtml(ref.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(ref.label)}</a></div>`).join('')}
      </div>
    </div>`).join('');
}

function applySearch(){
  const kw = document.getElementById('searchInput').value.trim().toLowerCase();
  const from = document.getElementById('dateFrom').value;
  const to = document.getElementById('dateTo').value;

  const filtered = SEARCH_RESULTS.filter(r => {
    if (filterState.risk.size && !filterState.risk.has(r.risk)) return false;
    if (filterState.source.size && !filterState.source.has(r.source)) return false;
    if (filterState.vendor.size && !filterState.vendor.has(r.vendor)) return false;
    if (from && r.pubDate < from) return false;
    if (to && r.pubDate > to) return false;
    if (kw){
      const hay = [r.title, r.vendor, ...r.products, ...r.cves].join(' ').toLowerCase();
      if (!hay.includes(kw)) return false;
    }
    return true;
  });
  renderResults(filtered);
}

buildFilterOptions();
renderResults(SEARCH_RESULTS);
document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') applySearch(); });
</script>
</body>
</html>
