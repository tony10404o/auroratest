<style>
  :root{
    --bg:#FFFFFF;--panel:#F8FAFC;--panel-alt:#F1F5F9;--border:#E2E8F0;
    --text:#1E293B;--text-dim:#64748B;--text-faint:#94A3B8;
    --accent:#2563EB;--accent-dim:#1D4ED8;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);
    font-family:'IBM Plex Sans TC','Noto Sans TC',sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:1560px;margin:0 auto;padding:20px;}

  /* 頂部跑馬燈 */
  .ticker-bar{
    background:#0F172A;color:#E2E8F0;overflow:hidden;position:relative;
    white-space:nowrap;padding:9px 0;font-family:'JetBrains Mono',monospace;font-size:12.5px;
  }
  .ticker-label{
    position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;gap:6px;
    background:#DC2626;color:#fff;padding:0 14px;font-weight:700;font-size:11.5px;z-index:2;
    white-space:nowrap;
  }
  .ticker-track{display:inline-flex;padding-left:100%;animation:ticker-scroll 45s linear infinite;}
  .ticker-track.paused{animation-play-state:paused;}
  .ticker-item{display:inline-flex;align-items:center;margin-right:48px;flex-shrink:0;}
  .ticker-item a{color:#E2E8F0;text-decoration:none;position:relative;z-index:3;}
  .ticker-item a:hover{text-decoration:underline;color:#60A5FA;}
  .ticker-sep{color:#475569;margin-right:48px;flex-shrink:0;}
  @keyframes ticker-scroll{
    0%{transform:translateX(0);}
    100%{transform:translateX(-50%);}
  }
  @media (max-width:640px){
    .ticker-bar{overflow-x:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:center;white-space:nowrap;}
    .ticker-label{position:static;flex-shrink:0;margin-right:10px;}
    .ticker-track{animation:none !important;padding-left:0;display:inline-flex;}
  }
  .layout-row{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
  .box-big{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;height:100%;min-height:400px;}
  .box-right-group{display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);gap:12px;height:100%;}
  .box-small{background:var(--panel);border:1px solid var(--border);border-left-width:4px;border-radius:10px;padding:16px;height:100%;}
  .box-small.c-blue{border-left-color:#2563EB;}
  .box-small.c-green{border-left-color:#059669;}
  .box-small.c-orange{border-left-color:#D97706;}
  .box-small.c-red{border-left-color:#DC2626;}
  .strip-label{font-size:12.5px;font-weight:600;margin-bottom:8px;}
  .box-small.c-blue .strip-label{color:#2563EB;}
  .box-small.c-green .strip-label{color:#059669;}
  .box-small.c-orange .strip-label{color:#D97706;}
  .box-small.c-red .strip-label{color:#DC2626;}
  .strip-label-sub{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:var(--text-faint);}
  .strip-number{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;line-height:1;}
  .box-small.c-blue .strip-number{color:#2563EB;}
  .box-small.c-green .strip-number{color:#059669;}
  .box-small.c-orange .strip-number{color:#D97706;}
  .box-small.c-red .strip-number{color:#DC2626;}
  .box-small.clickable{cursor:pointer;transition:box-shadow .15s;}
  .box-small.clickable:hover{box-shadow:0 2px 8px rgba(0,0,0,0.08);}

  /* 統計彈跳視窗 */
  .stat-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;padding:20px;}
  .stat-modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;max-width:560px;width:100%;max-height:70vh;display:flex;flex-direction:column;}
  .stat-modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);font-weight:700;font-size:14px;}
  .stat-modal-close{background:none;border:none;color:var(--text-dim);font-size:16px;cursor:pointer;padding:2px 6px;}
  .stat-modal-close:hover{color:var(--text);}
  .stat-modal-body{overflow-y:auto;padding:8px 18px 16px;}
  .stat-modal-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px dashed var(--border);font-size:12.5px;}
  .stat-modal-row:first-child{border-top:none;}
  .stat-modal-row-label{color:var(--text);flex:1;}
  .stat-modal-row-value{font-family:'JetBrains Mono',monospace;color:var(--text-dim);white-space:nowrap;}
  .empty-note{color:var(--text-faint);font-size:12px;padding:10px 0;font-family:'JetBrains Mono',monospace;}
  .box-label{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;color:var(--text-dim);}
  @media (max-width:1100px){
    .layout-row{grid-template-columns:1fr;}
    .box-right-group{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:560px){
    .box-right-group{grid-template-columns:1fr;}
  }
</style>

function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

function renderTicker(data){
  const track = document.getElementById('tickerTrack');
  if (!track) return;

  const headlineTitles = (data.headlines || []).map(h => ({ title: h.title, url: h.url }));
  const todayCutoff = Date.now() - 86400000;
  const eventTitles = (data.global_events || [])
    .filter(e => { const d = new Date(e.date); return isNaN(d.getTime()) ? true : d.getTime() >= todayCutoff; })
    .map(e => ({ title: e.title, url: e.url }));

  const seen = new Set();
  const items = [...headlineTitles, ...eventTitles].filter(i => {
    if (!i.title || seen.has(i.title)) return false;
    seen.add(i.title);
    return true;
  });

  if (!items.length){
    track.textContent = '目前沒有今日新聞資料';
    track.style.animation = 'none';
    return;
  }

  const itemHtml = items.map(i =>
    `<span class="ticker-item">${escapeHtml(i.title)}</span><span class="ticker-sep">•</span>`
  ).join('');

  track.innerHTML = itemHtml + itemHtml;
}

renderTicker(DATA);

function renderCategoryCounts(counts){
  if (!counts) return;
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val ?? 0; };
  set('numKev', counts.kev);
  set('numVendor', counts.vendor);
  set('numNews', counts.news);
  set('numRansom', counts.ransomwareApt);
}
renderCategoryCounts(DATA.category_counts);

function emptyNote(){ return '<div class="empty-note">目前沒有資料</div>'; }

function statModalBody(type){
  const d = DATA;
  if (type === 'kev'){
    const items = d.cve_radar || [];
    const rows = items.map(v => `
      <div class="stat-modal-row">
        <span class="stat-modal-row-label">${escapeHtml(v.cve_id||'')}：${escapeHtml(v.title||'')}</span>
        <span class="stat-modal-row-value">CVSS ${v.cvss ?? '—'}</span>
      </div>`).join('');
    return { title: '今日漏洞雷達（KEV）', body: rows || emptyNote() };
  }
  if (type === 'vendor'){
    const items = d.vendor_impact || [];
    const rows = items.map(v => `
      <div class="stat-modal-row">
        <span class="stat-modal-row-label">${escapeHtml(v.title||'')}</span>
        <span class="stat-modal-row-value">${escapeHtml(v.impact||'')}</span>
      </div>`).join('');
    return { title: 'AI企業影響分析', body: rows || emptyNote() };
  }
  if (type === 'news'){
    const items = d.headlines || [];
    const rows = items.map(h => `
      <div class="stat-modal-row">
        <span class="stat-modal-row-label">${escapeHtml(h.title||'')}</span>
        <span class="stat-modal-row-value">${escapeHtml(h.impact||'')}</span>
      </div>`).join('');
    return { title: '今日資安新聞（今日頭條）', body: rows || emptyNote() };
  }
  if (type === 'ransomApt'){
    const items = (d.global_events || []).filter(e => e.category === '勒索病毒' || e.category === 'APT攻擊');
    const rows = items.map(e => `
      <div class="stat-modal-row">
        <span class="stat-modal-row-label">[${escapeHtml(e.category||'')}] ${escapeHtml(e.title||'')}</span>
        <span class="stat-modal-row-value">${escapeHtml(e.date||'')}</span>
      </div>`).join('');
    return { title: '勒索軟體／APT事件', body: rows || emptyNote() };
  }
  return { title: '', body: emptyNote() };
}

function openStatModal(type){
  const { title, body } = statModalBody(type);
  document.getElementById('statModalTitle').textContent = title;
  document.getElementById('statModalBody').innerHTML = body;
  document.getElementById('statModal').style.display = 'flex';
}
function closeStatModal(){
  document.getElementById('statModal').style.display = 'none';
}
window.openStatModal = openStatModal;
window.closeStatModal = closeStatModal;
</script>
<div class="stat-modal-overlay" id="statModal" onclick="if(event.target===this)closeStatModal()">
  <div class="stat-modal">
    <div class="stat-modal-header">
      <span id="statModalTitle"></span>
      <button class="stat-modal-close" onclick="closeStatModal()">✕</button>
    </div>
    <div class="stat-modal-body" id="statModalBody"></div>
  </div>
</div>

</body>
</html>
