<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資安輿情展示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;--panel:#F8FAFC;--panel-alt:#F1F5F9;--border:#E2E8F0;
    --text:#1E293B;--text-dim:#64748B;--text-faint:#94A3B8;
    --accent:#2563EB;--accent-dim:#1D4ED8;
    --sev-high:#DC2626;--sev-high-bg:rgba(220,38,38,0.08);
    --sev-medium:#D97706;--sev-medium-bg:rgba(217,119,6,0.08);
    --sev-low:#059669;--sev-low-bg:rgba(5,150,105,0.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse 900px 500px at 15% -10%, rgba(37,99,235,0.04), transparent), var(--bg);
    color:var(--text);font-family:'IBM Plex Sans TC','Noto Sans TC',sans-serif;
    min-height:100vh;padding:24px 20px 60px;
  }
  .wrap{max-width:1560px;margin:0 auto;}

  /* header */
  .header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;padding-bottom:16px;margin-bottom:4px;border-bottom:1px solid var(--border);}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#2A5CAF);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .brand h1{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;letter-spacing:0.3px;}
  .brand .sub{font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;margin-top:1px;}
  .meta-line{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);}

  .dashboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-top:18px;}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;min-width:0;}
  .panel-header{display:flex;align-items:center;gap:6px;margin-bottom:12px;}
  .panel-num{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:var(--text-dim);}
  .panel-icon{font-size:14px;}
  .panel-title{font-weight:700;font-size:13.5px;color:var(--text);}
  .panel-count-badge{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;color:var(--accent);background:rgba(37,99,235,0.08);padding:2px 9px;border-radius:20px;white-space:nowrap;}
  .panel-viewall{margin-left:auto;font-size:11px;color:var(--accent);text-decoration:none;font-family:'JetBrains Mono',monospace;white-space:nowrap;}
  .panel-viewall:hover{text-decoration:underline;}
  .panel-body{flex:1;max-height:420px;overflow-y:auto;padding-right:4px;scrollbar-width:thin;scrollbar-color:transparent transparent;}
  .panel-body:hover{scrollbar-color:var(--text-faint) transparent;}
  .panel-body::-webkit-scrollbar{width:5px;}
  .panel-body::-webkit-scrollbar-track{background:transparent;}
  .panel-body::-webkit-scrollbar-thumb{background:transparent;border-radius:10px;}
  .panel-body:hover::-webkit-scrollbar-thumb{background:var(--text-faint);}
  .empty-note{color:var(--text-faint);font-size:12px;padding:10px 0;font-family:'JetBrains Mono',monospace;}
  .show-more-btn{
    width:100%;margin-top:8px;padding:8px;background:var(--panel-alt);border:1px dashed var(--border);
    border-radius:7px;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;
    cursor:pointer;transition:background .15s;
  }
  .show-more-btn:hover{background:var(--border);}

  /* impact / tags */
  .impact-badge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;}
  .impact-高{color:var(--sev-high);background:var(--sev-high-bg);}
  .impact-中{color:var(--sev-medium);background:var(--sev-medium-bg);}
  .impact-低{color:var(--sev-low);background:var(--sev-low-bg);}
  .stars{font-size:10.5px;color:#F59E0B;letter-spacing:1px;white-space:nowrap;}

  /* panel 1: 頭條 */
  .headline-row{display:flex;gap:10px;padding:9px 0;border-top:1px dashed var(--border);}
  .headline-row:first-child{border-top:none;padding-top:0;}
  .headline-num{width:18px;height:18px;border-radius:50%;background:var(--panel-alt);color:var(--text-dim);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'JetBrains Mono',monospace;margin-top:1px;}
  .headline-body{flex:1;min-width:0;}
  .headline-title-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .headline-title{font-size:12.5px;font-weight:600;line-height:1.4;margin-bottom:3px;overflow-wrap:anywhere;flex:1;min-width:60%;}
  .headline-title-tags{display:flex;align-items:center;gap:8px;flex-shrink:0;white-space:nowrap;}
  .headline-title a{color:var(--text);text-decoration:none;}
  .headline-title a:hover{color:var(--accent);}
  .headline-sub{font-size:10.5px;color:var(--text-dim);margin-bottom:4px;}
  .headline-meta{display:flex;justify-content:space-between;align-items:center;gap:6px;}

  /* panel 2: 全球重大事件 */
  .tab-row{display:flex;gap:6px;margin-bottom:10px;}
  .tab-btn{font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;}
  .tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .vendor-pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .vendor-pill{font-family:'Noto Sans TC',sans-serif;font-size:11px;padding:4px 11px;border-radius:20px;border:1px solid var(--border);background:var(--panel-alt);color:var(--text-dim);cursor:pointer;white-space:nowrap;}
  .vendor-pill:hover{background:var(--border);}
  .vendor-pill.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .update-card{background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
  .update-card-top{display:flex;align-items:flex-start;gap:8px;}
  .update-vendor-icon{font-size:15px;flex-shrink:0;margin-top:1px;}
  .update-title{font-size:12.5px;font-weight:600;line-height:1.4;overflow-wrap:anywhere;flex:1;min-width:0;}
  .update-title a{color:var(--text);text-decoration:none;}
  .update-title a:hover{color:var(--accent);}
  .update-status-select{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0;border:1px solid var(--border);cursor:pointer;appearance:none;-webkit-appearance:none;text-align:center;text-align-last:center;color:var(--text-dim);background:var(--panel);}
  .update-status-select.status-不處理{color:var(--sev-high);background:var(--sev-high-bg);border-color:transparent;}
  .update-status-select.status-處理中{color:var(--sev-medium);background:var(--sev-medium-bg);border-color:transparent;}
  .update-status-select.status-已完成{color:var(--sev-low);background:var(--sev-low-bg);border-color:transparent;}
  .update-status-select option{color:var(--text);background:var(--panel);font-weight:400;}
  .update-cve-line{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-faint);margin-top:6px;margin-left:23px;}
  .update-cve-line b{color:var(--text-dim);font-weight:600;}
  .event-time{font-size:10.5px;color:var(--text-faint);white-space:nowrap;font-family:'JetBrains Mono',monospace;margin-top:2px;}

  /* Panel 7: 今日建議行動 */
  .action-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--border);}
  .action-row:first-child{border-top:none;padding-top:0;}
  .action-num{width:20px;height:20px;border-radius:50%;background:var(--panel-alt);color:var(--text-dim);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'JetBrains Mono',monospace;margin-top:1px;}
  .action-body{flex:1;min-width:0;}
  .action-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px;overflow-wrap:anywhere;line-height:1.4;}
  .action-detail{font-size:12px;color:var(--text-dim);margin-bottom:8px;line-height:1.6;overflow-wrap:anywhere;}
  .action-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .action-cat-tag{font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 9px;border-radius:20px;background:var(--panel-alt);color:var(--text-dim);}
  .action-priority{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;}
  .action-priority-高{color:var(--sev-high);background:var(--sev-high-bg);}
  .action-priority-中{color:var(--sev-medium);background:var(--sev-medium-bg);}
  .action-priority-低{color:var(--sev-low);background:var(--sev-low-bg);}
  .copy-ticket-btn{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--accent);background:none;border:1px solid var(--border);border-radius:20px;padding:3px 10px;cursor:pointer;white-space:nowrap;}
  .copy-ticket-btn:hover{background:var(--panel-alt);}
  .copy-ticket-btn.copied{color:var(--sev-low);border-color:var(--sev-low);}

  /* Panel 8: AI新聞摘要 */
  .digest-tabs{display:flex;gap:6px;margin-bottom:12px;}
  .digest-tab-btn{font-family:'JetBrains Mono',monospace;font-size:11px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--text-dim);cursor:pointer;}
  .digest-tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .digest-text{font-size:13px;line-height:1.8;color:var(--text);white-space:pre-line;}
  .digest-meta{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-faint);margin-top:12px;padding-top:10px;border-top:1px dashed var(--border);}

  /* panel 3: CVE 雷達 */
  .cve-table{width:100%;border-collapse:collapse;font-size:11.5px;}
  .cve-plain-card{background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px;}
  .cve-plain-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;}
  .cve-plain-title-row{display:flex;align-items:flex-start;gap:8px;flex:1;min-width:0;}
  .cve-vendor-icon{font-size:16px;flex-shrink:0;margin-top:1px;}
  .cve-plain-title{font-size:13.5px;font-weight:700;color:var(--text);line-height:1.4;}
  .exploited-status-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
  .exploited-status-badge.is-exploited{color:var(--sev-high);background:var(--sev-high-bg);}
  .exploited-status-badge.is-watch{color:var(--text-dim);background:var(--panel);}
  .cve-plain-summary{font-size:12.5px;color:var(--text-dim);line-height:1.7;margin-bottom:8px;}
  .cve-plain-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .cve-id-small{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-faint);}
  .cve-severity-tag{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;color:var(--accent);background:rgba(37,99,235,0.08);padding:2px 8px;border-radius:20px;}
  .cve-kev-tag{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;color:var(--sev-high);background:var(--sev-high-bg);padding:2px 8px;border-radius:20px;}
  .cve-ai-suggestion{font-size:11.5px;color:var(--text-dim);background:var(--panel);border-radius:6px;padding:7px 10px;margin-top:8px;line-height:1.6;}
  .cve-ai-suggestion b{color:var(--accent);}
  .cve-table th{text-align:left;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-faint);font-weight:600;padding:0 4px 8px;border-bottom:1px solid var(--border);}
  .cve-table td{padding:8px 4px;border-bottom:1px dashed var(--border);vertical-align:top;}
  .cve-advice-row td{padding:0 4px 10px;border-bottom:1px dashed var(--border);font-size:11.5px;color:var(--text-dim);}
  .cve-table tr:last-child td{border-bottom:none;}
  .cve-id{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--text);}
  .cve-title{font-size:10.5px;color:var(--text-dim);margin-top:2px;overflow-wrap:anywhere;}
  .cvss-num{font-family:'JetBrains Mono',monospace;font-weight:700;}
  .cvss-source{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:500;color:var(--text-faint);margin-top:1px;}
  .exploited-yes{color:var(--sev-high);font-weight:700;font-size:10.5px;}
  .exploited-no{color:var(--text-faint);font-size:10.5px;}
  .action-badge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap;display:inline-block;}
  .action-立即更新{background:var(--sev-high);color:#fff;}
  .action-一週內更新{background:var(--sev-medium);color:#fff;}
  .action-持續觀察{background:var(--panel-alt);color:var(--text-dim);}
  .action-暫不處理{background:transparent;color:var(--text-faint);border:1px solid var(--border);}

  /* panel 4: 廠商影響 */
  .vendor-card{display:flex;gap:10px;padding:10px 0;border-top:1px dashed var(--border);}
  .vendor-card:first-child{border-top:none;padding-top:0;}
  .vendor-icon{width:30px;height:30px;border-radius:8px;background:var(--panel-alt);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
  .vendor-body{flex:1;min-width:0;}
  .vendor-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:3px;}
  .vendor-title{font-size:12.5px;font-weight:600;overflow-wrap:anywhere;}
  .vendor-asset{font-size:10.5px;color:var(--text-dim);margin-bottom:4px;}
  .vendor-asset .tag-chip{display:inline-block;background:var(--panel-alt);border-radius:5px;padding:1px 6px;margin-right:4px;font-family:'JetBrains Mono',monospace;font-size:10px;}
  .vendor-asset .category-chip{background:rgba(37,99,235,0.1);color:var(--accent);font-weight:600;}
  .vendor-suggestion{font-size:11px;color:var(--text-dim);line-height:1.6;background:var(--panel-alt);border-radius:6px;padding:6px 8px;margin-top:4px;}
  .vendor-suggestion b{color:var(--accent);}

  /* panel 5: 風險儀表板 */
  .gauge-wrap{display:flex;flex-direction:column;align-items:center;padding:2px 0 2px;}
  .gauge-score{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;margin-top:-6px;}
  .gauge-level{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;margin-bottom:8px;}
  .risk-bars{display:flex;flex-direction:column;gap:8px;}
  .risk-bar-row{display:flex;align-items:center;gap:8px;}
  .risk-bar-label{font-size:11px;color:var(--text-dim);width:76px;flex-shrink:0;}
  .risk-bar-track{flex:1;height:6px;background:var(--panel-alt);border-radius:4px;overflow:hidden;}
  .risk-bar-fill{height:100%;border-radius:4px;}
  .risk-bar-val{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-dim);width:34px;text-align:right;flex-shrink:0;}

  /* panel 6: 每日一題 */
  .learning-card{background:linear-gradient(135deg, rgba(37,99,235,0.06), rgba(37,99,235,0.01));border:1px solid var(--border);border-radius:10px;padding:14px;}
  .learning-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .learning-icon{width:32px;height:32px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .learning-title{font-size:13.5px;font-weight:700;}
  .learning-desc{font-size:12px;color:var(--text-dim);line-height:1.7;margin-bottom:10px;}
  .learning-bottom{display:flex;justify-content:space-between;align-items:center;}
  .learning-time{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-faint);}
  .learning-btn{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:#fff;background:var(--accent);border:none;padding:7px 14px;border-radius:7px;text-decoration:none;cursor:pointer;}
  .learning-btn:hover{background:var(--accent-dim);}

  .footer-note{text-align:center;font-size:11px;color:var(--text-faint);margin-top:26px;font-family:'JetBrains Mono',monospace;}

  /* 主管一眼摘要橫幅 */
  .glance-banner{
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--border);border-left-width:5px;
    border-radius:10px;padding:14px 18px;margin-bottom:18px;
  }
  .glance-banner.level-高{border-left-color:var(--sev-high);}
  .glance-banner.level-中{border-left-color:var(--sev-medium);}
  .glance-banner.level-低{border-left-color:var(--sev-low);}
  .glance-left{display:flex;align-items:center;gap:10px;flex:1;min-width:220px;}
  .glance-badge{
    font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;
    padding:4px 11px;border-radius:20px;white-space:nowrap;flex-shrink:0;
  }
  .glance-badge.level-高{color:var(--sev-high);background:var(--sev-high-bg);}
  .glance-badge.level-中{color:var(--sev-medium);background:var(--sev-medium-bg);}
  .glance-badge.level-低{color:var(--sev-low);background:var(--sev-low-bg);}
  .glance-headline{font-size:13.5px;font-weight:600;color:var(--text);overflow-wrap:anywhere;}
  .glance-stats{display:flex;gap:20px;flex-wrap:wrap;}
  .glance-stat{text-align:center;}
  .glance-stat-num{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;color:var(--text);line-height:1.1;}
  .glance-stat-num.risk-高{color:var(--sev-high);}
  .glance-stat-num.risk-中{color:var(--sev-medium);}
  .glance-stat-num.risk-低{color:var(--sev-low);}
  .glance-stat-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--text-dim);margin-top:2px;white-space:nowrap;}
  .glance-stat.clickable{cursor:pointer;border-radius:8px;padding:4px 8px;transition:background .15s;}
  .glance-stat.clickable:hover{background:var(--panel-alt);}

  /* 統計彈跳視窗 */
  .stat-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;padding:20px;}
  .stat-modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;max-width:560px;width:100%;max-height:70vh;display:flex;flex-direction:column;}
  .stat-modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);font-weight:700;font-size:14px;}
  .stat-modal-close{background:none;border:none;color:var(--text-dim);font-size:16px;cursor:pointer;padding:2px 6px;}
  .stat-modal-close:hover{color:var(--text);}
  .stat-modal-body{overflow-y:auto;padding:8px 18px 16px;}
  .ai-analysis-card{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;padding:16px 18px;margin-bottom:18px;}
  .ai-analysis-card-header{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;color:var(--text);margin-bottom:10px;}
  .ai-analysis-text{font-size:13px;line-height:1.9;color:var(--text);white-space:pre-line;}
  .ai-analysis-list{margin:0;padding-left:20px;font-size:13px;line-height:1.9;color:var(--text);}
  .ai-analysis-list li{margin-bottom:6px;}
  .ai-analysis-meta{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-faint);margin-top:14px;padding-top:10px;border-top:1px dashed var(--border);}
  .stat-modal-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px dashed var(--border);font-size:12.5px;}
  .stat-modal-row:first-child{border-top:none;}
  .stat-modal-row-label{color:var(--text);flex:1;}
  .stat-modal-row-value{font-family:'JetBrains Mono',monospace;color:var(--text-dim);white-space:nowrap;}

  /* 分類統計字卡（色條風格） */
  .stat-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1 1 0;min-width:480px;height:auto;}
  .top-combined-row{display:flex;align-items:stretch;gap:14px;margin-bottom:18px;flex-wrap:wrap;}

function emptyNote(){ return `<div class="empty-note">目前沒有資料</div>`; }

// 事件是否落在指定分頁範圍：「今天」看第一次被抓到的日期（first_seen，來源發布日期常是前幾天），
// 「本月」等其他範圍仍看事件日期
function eventInRange(e, rangeDays){
  if (rangeDays === 1) {
    // 「今天」＝最近一批新抓到的事件（今天沒有新資料時，顯示最近一次更新的那批，避免空白）
    if (!e.first_seen) return isWithinCalendarDays(e.date, 1);
    const seen = (DATA.global_events || []).map(x => x.first_seen).filter(Boolean).sort();
    return e.first_seen === seen[seen.length - 1];
  }
  return isWithinCalendarDays(e.date, rangeDays);
}

// 用「日曆天數」而非精確24小時區間比對日期，避免事件日期(只有年月日、視為UTC午夜)跟目前時間比較時
// 因為時區／當下時刻差異，導致「今天」分類篩不到今天剛發布、但還不滿24小時的項目
function isWithinCalendarDays(dateStr, rangeDays){
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return true;
  const now = new Date();
  const todayMidnightUTC = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  const diffDays = Math.floor((todayMidnightUTC - d.getTime()) / 86400000);
  return diffDays <= (rangeDays - 1);
}

      ${badgeId === 'windowsUpdateBadge' ? '<span style="font-size:10.5px;color:var(--text-dim);white-space:nowrap;">待處理＋處理中</span>' : ''}
      ${viewAllUrl ? `<a class="panel-viewall" href="${escapeHtml(viewAllUrl)}" target="_blank" rel="noopener noreferrer">查看全部 →</a>` : ''}
    </div>
    ${extraHeaderHtml}
    <div class="panel-body">${bodyHtml}</div>
  </div>`;
}

}

function timeAgoLabel(dateStr){
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return dateStr;
  const diffMs = Date.now() - d.getTime();
  const diffDays = Math.floor(diffMs / 86400000);
  if (diffDays <= 0) return '今天';
  if (diffDays === 1) return '昨天';
  return `${diffDays}天前`;
}

function updatePendingCount(){
  const badge = document.getElementById('pendingCountNum');

    return saved !== '不處理' && saved !== '已完成';
  }).length;
  badge.textContent = remaining;
  renderStatusSummary();
}

  const m = (title || '').match(/CVE-\d{4}-\d+/);

}

function stableIdFor(text){
  // 用簡單雜湊把標題文字轉成穩定的短識別碼，當作儲存的key
  let hash = 0;
  const s = text || '';
  for (let i = 0; i < s.length; i++) {
    hash = ((hash << 5) - hash + s.charCodeAt(i)) | 0;
  }
  return 'id' + Math.abs(hash);
}

// 本機快取格式改為 JSON {status, updatedAt(毫秒時間戳)}，才能判斷「不處理／已完成」是幾天前標記的
const AUTO_REMOVE_DAYS = 3;

function getLocalStatusMeta(id){
  try {
    const raw = localStorage.getItem(STATUS_STORAGE_PREFIX + id);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (parsed && typeof parsed === 'object' && parsed.status) return parsed;
    return null;
  } catch (e) {
    return null;
  }
}
function setLocalStatus(id, value, updatedAtMs){
  try {
    if (value) {
      const meta = { status: value, updatedAt: updatedAtMs || Date.now() };
      localStorage.setItem(STATUS_STORAGE_PREFIX + id, JSON.stringify(meta));
    } else {
      localStorage.removeItem(STATUS_STORAGE_PREFIX + id);
    }
  } catch (e) { /* 忽略儲存失敗 */ }
}
function getLocalStatus(id){
  const meta = getLocalStatusMeta(id);
  return meta ? meta.status : '';
}

// 一開始先用本機快取當作立即可用的資料，Supabase抓到之後會覆蓋、並重新畫面
function getSavedStatus(id){
  return getLocalStatus(id);
}

// 判斷這筆「不處理／已完成」是否已標記超過 AUTO_REMOVE_DAYS 天，超過的話要從清單中自動消除
function isAutoRemoved(id){
  const meta = getLocalStatusMeta(id);
  if (!meta) return false;
  if (meta.status !== '不處理' && meta.status !== '已完成') return false;
  const ageDays = (Date.now() - meta.updatedAt) / 86400000;
  return ageDays >= AUTO_REMOVE_DAYS;
}

async function saveStatus(id, value){
  setLocalStatus(id, value); // 立即更新本機，畫面不用等雲端
  if (!supabaseClient) return;
  try {
    if (value) {
      await supabaseClient.from('update_status').upsert({ id, status: value, updated_at: new Date().toISOString() });
    } else {
      await supabaseClient.from('update_status').delete().eq('id', id);
    }
  } catch (e) {
    console.error('雲端同步狀態失敗（已保留在本機）：', e.message || e);
  }
}

// 從Supabase一次抓回所有已儲存的狀態，合併進本機快取，並重新渲染待處理事項面板
async function syncStatusFromCloud(){
  if (!supabaseClient) return;
  try {
    const { data, error } = await supabaseClient.from('update_status').select('id, status, updated_at');
    if (error) throw error;
    let changed = false;
    (data || []).forEach(row => {
      const cloudUpdatedAt = row.updated_at ? new Date(row.updated_at).getTime() : Date.now();
      if (getLocalStatus(row.id) !== (row.status || '')) changed = true;
      setLocalStatus(row.id, row.status || '', cloudUpdatedAt);
    });
    if (changed && typeof window.__rerenderUpdatePanel === 'function') {
      window.__rerenderUpdatePanel();
    }
  } catch (e) {
    console.error('雲端狀態同步失敗（沿用本機資料）：', e.message || e);
  }
}

function renderGlobalEvents(items, rangeDays){
  const filtered = (items || []).filter(e => {
    if (!eventInRange(e, rangeDays)) return false;
    // 標記「不處理」或「已完成」滿3天後，從清單自動消除
    return !isAutoRemoved(stableIdFor(e.title));
  });
  if (!filtered.length) return emptyNote();
  const rows = filtered.map(e => {
    const cve = extractCve(e.title);
    const id = stableIdFor(e.title);
    const saved = getSavedStatus(id);
    return `
    <div class="update-card">
      <div class="update-card-top">
        <span class="update-vendor-icon">${vendorIconFor(e.title)}</span>
        <div class="update-title">${e.url ? `<a href="${escapeHtml(e.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(e.title)}</a>` : escapeHtml(e.title)}</div>
        <select class="update-status-select${saved ? ' status-' + saved : ''}" data-item-id="${id}" onchange="onStatusChange(this)">
          <option value="" ${!saved ? 'selected' : ''}>待處理</option>
          <option value="不處理" ${saved === '不處理' ? 'selected' : ''}>不處理</option>
          <option value="處理中" ${saved === '處理中' ? 'selected' : ''}>處理中</option>
          <option value="已完成" ${saved === '已完成' ? 'selected' : ''}>已完成</option>
        </select>
      </div>
      ${cve ? `<div class="update-cve-line"><b>CVE：</b>${escapeHtml(cve)}</div>` : ''}
    </div>`;
  });
  return withShowMore(rows);
}

function setupGlobalEventsPanel(items){
  const body = document.getElementById('globalEventsBody');
  const badge = document.getElementById('windowsUpdateBadge');
  const tabs = document.querySelectorAll('.tab-btn');
  let currentDays = 30;
  function render(days){
    currentDays = days;
    const filtered = (items || []).filter(e => {
      if (!eventInRange(e, days)) return false;
      return !isAutoRemoved(stableIdFor(e.title));
    });
    body.innerHTML = renderGlobalEvents(items, days);
    // 徽章數字跟「待處理事項」統計卡用同一套定義：排除已標記「不處理／已完成」的項目，
    // 不要單純算畫面上渲染的筆數（渲染筆數在3天緩衝期內還會包含剛標記完成的項目，數字會對不上）
    if (badge) {
      const pending = filtered.filter(e => {
        const saved = getSavedStatus(stableIdFor(e.title));
        return saved !== '不處理' && saved !== '已完成';
      }).length;
      badge.textContent = `${pending} / ${filtered.length} 件`;
    }
    updatePendingCount();
  }
  tabs.forEach(btn => {
    btn.addEventListener('click', () => {
      tabs.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render(parseInt(btn.dataset.days, 10));
    });
  });
  render(30);
  window.__rerenderUpdatePanel = () => render(currentDays);
}

/* ---------- Panel 5: AI風險熱度儀表板 ---------- */
function gaugeColor(score){
  if (score >= 70) return 'var(--sev-high)';
  if (score >= 40) return 'var(--sev-medium)';
  return 'var(--sev-low)';
}
function gaugeLevel(score){
  if (score >= 70) return '高風險';
  if (score >= 40) return '中風險';
  return '低風險';
}

function renderGaugeSvg(score){
  const cx = 62, cy = 60, r = 48;
  const needleAngle = Math.PI - (score/100) * Math.PI;
  const nxF = cx + (r-8) * Math.cos(needleAngle);
  const nyF = cy - (r-8) * Math.sin(needleAngle);
  const color = gaugeColor(score);
  return `<svg width="124" height="72" viewBox="0 0 124 72">
    <path d="M 14 60 A 48 48 0 0 1 110 60" fill="none" stroke="var(--panel-alt)" stroke-width="9" stroke-linecap="round"/>
    <path d="M 14 60 A 48 48 0 0 1 110 60" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="${Math.PI*48}" stroke-dashoffset="${Math.PI*48*(1-score/100)}"/>
    <circle cx="${cx}" cy="${cy}" r="4" fill="${color}"/>
    <line x1="${cx}" y1="${cy}" x2="${nxF}" y2="${nyF}" stroke="${color}" stroke-width="2.5" stroke-linecap="round"/>
  </svg>`;
}

function renderRiskGauge(risk){
  if (!risk) return emptyNote();
  const score = risk.total ?? 0;
  const breakdown = risk.breakdown || [];
  const bars = breakdown.map(b => `
    <div class="risk-bar-row">
      <div class="risk-bar-label">${escapeHtml(b.label)}</div>
      <div class="risk-bar-track"><div class="risk-bar-fill" style="width:${b.score}%;background:${gaugeColor(b.score)}"></div></div>
      <div class="risk-bar-val">${b.score}/100</div>
    </div>`).join('');
  return `
    <div class="gauge-wrap">
      ${renderGaugeSvg(score)}
      <div class="gauge-score" style="color:${gaugeColor(score)}">${score}<span style="font-size:14px;color:var(--text-dim);">/100</span></div>
      <div class="gauge-level" style="color:${gaugeColor(score)}">${gaugeLevel(score)}</div>
    </div>
    <div class="risk-bars">${bars}</div>`;
}

  panelShell('②', '🎯', '今日漏洞雷達 (CVE)', null, renderCveRadar(DATA.cve_radar), '', '#2563EB', (DATA.cve_radar||[]).length) +
  panelShell('③', '🏢', '公司關注廠商情報', null, `<div id="vendorImpactBody"></div>`, `<div id="vendorPillRow"></div>`, '#059669', (DATA.vendor_impact||[]).length) +
  panelShell('④', '🪟', '待處理事項', null,
    `<div id="globalEventsBody"></div>`,
    `<div class="tab-row">
      <button class="tab-btn" data-days="1">今天</button>
      <button class="tab-btn active" data-days="30">本月</button>
    </div>`, '', todayWinCount, 'windowsUpdateBadge') +
  panelShell('⑤', '🚨', '安全宣導', null, `<div id="twScamBody"></div>`, '', '#DC2626', (DATA.tw_scam_events||[]).length);

setupGlobalEventsPanel(DATA.global_events);
setupVendorPillFilter(DATA.vendor_impact);
syncStatusFromCloud();

function setupVendorPillFilter(items){
  const pillRow = document.getElementById('vendorPillRow');
  const body = document.getElementById('vendorImpactBody');
  if (!pillRow || !body) return;

  const vendorNames = [...new Set((items || []).map(v => v.vendor).filter(Boolean))];
  let activeVendor = null;

  function render(){
    const filtered = activeVendor ? items.filter(v => v.vendor === activeVendor) : items;
    body.innerHTML = renderVendorImpact(filtered);
  }

  pillRow.innerHTML = `
    <div class="vendor-pill-row">
      <button class="vendor-pill active" data-vendor="">全部</button>
      ${vendorNames.map(v => `<button class="vendor-pill" data-vendor="${escapeHtml(v)}">${vendorIconFor(v)} ${escapeHtml(v)}</button>`).join('')}
    </div>`;

  pillRow.querySelectorAll('.vendor-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      pillRow.querySelectorAll('.vendor-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeVendor = btn.dataset.vendor || null;
      render();
    });
  });

  render();
}
</script>

<style>
  .panel-wide{grid-column:span 2;}
  @media (max-width:760px){.panel-wide{grid-column:auto;}}
  .tw-item{padding:10px 0;border-bottom:1px solid var(--border);}
  .tw-item:last-child{border-bottom:none;}
  .tw-item-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--text-dim);margin-bottom:3px;}
  .tw-tag{font-weight:700;color:#DC2626;background:rgba(220,38,38,.1);padding:1px 8px;border-radius:20px;}
  .tw-item-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px;}
  .tw-item-title a{color:inherit;text-decoration:none;}
  .tw-item-title a:hover{text-decoration:underline;color:#2563EB;}
  .tw-item-sum{font-size:12px;color:var(--text-dim);line-height:1.5;}
  .tw-empty{padding:18px 0;font-size:12.5px;color:var(--text-faint);text-align:center;}
  .tw-row{font-size:12px;line-height:1.5;margin-top:4px;padding:5px 9px;border-radius:6px;}
  .tw-risk{background:rgba(220,38,38,.07);color:var(--text);}
  .tw-advice{background:rgba(5,150,105,.09);color:var(--text);}
  .tw-row b{margin-right:4px;}
  .tw-risk b{color:#DC2626;}
  .tw-advice b{color:#059669;}
  .tw-note{padding-top:8px;font-size:10.5px;color:var(--text-faint);}
</style>
<script>
(function(){
  const items = Array.isArray(DATA.tw_scam_events) ? DATA.tw_scam_events : [];
  const body = document.getElementById('twScamBody');
  if (!body) return;
  const wrap = body.closest('.panel'); if (wrap) wrap.classList.add('panel-wide');
  const safe = u => /^https?:\/\//i.test(u || '') ? u : '';
  body.innerHTML = (items.length ? items.map(e => {
    const u = safe(e.source_url);
    const title = escapeHtml(e.title || '');
    return `<div class="tw-item">
      <div class="tw-item-top"><span class="tw-tag">${escapeHtml(e.type || '詐騙')}</span><span>${escapeHtml(e.date || '')}</span><span>${escapeHtml(e.source_name || '')}</span></div>
      <div class="tw-item-title">${u ? `<a href="${escapeHtml(u)}" target="_blank" rel="noopener noreferrer">${title}</a>` : title}</div>
      <div class="tw-item-sum">${escapeHtml(e.summary || '')}</div>
      ${e.risk ? `<div class="tw-row tw-risk"><b>⚠️ 可能風險</b>${escapeHtml(String(e.risk).replace(/^可能風險[:：]\s*/, ''))}</div>` : ''}
      ${e.advice ? `<div class="tw-row tw-advice"><b>✅ 正確做法</b>${escapeHtml(String(e.advice).replace(/^正確做法[:：]\s*/, ''))}</div>` : ''}
    </div>`;
  }).join('') : '<div class="tw-empty">目前沒有資料，下次自動更新後會顯示</div>')
  + '<div class="tw-note">由AI於資料產生當下搜尋彙整，非即時資訊，僅供參考</div>';
})();
</script>
</body>
</html>
